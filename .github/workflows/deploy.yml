name: Deploy portfolio

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: portfolio-production
  cancel-in-progress: false

env:
  S3_BUCKET: mahesh-portfolio-v1
  CLOUDFRONT_DISTRIBUTION_ID: E3790KDCS3YVZO

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portfolio
        run: |
          npm run build
          test -s .output/public/index.html

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::337119476250:role/mahesh-jillela-gha-role
          aws-region: ap-southeast-2

      - name: Sync static files to S3
        run: aws s3 sync .output/public/ "s3://${S3_BUCKET}/" --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
